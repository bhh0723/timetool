<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간표 툴</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f172a; color: #e2e8f0;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 24px 20px;
}
h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; color: #f1f5f9; }
.subtitle { font-size: .78rem; color: #64748b; margin-bottom: 14px; }

.day-bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
.day-tab { padding: 5px 13px; border-radius: 20px; font-size: .8rem; font-weight: 600; border: 1.5px solid #e4e4e7; background: #1e293b; color: #64748b; cursor: pointer; transition: all .18s; white-space: nowrap; }
.day-tab.on     { border-color: var(--tc); background: var(--tc); color: #fff; }
.day-tab.active { outline: 2.5px solid #fff; outline-offset: 2px; }

.copy-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; background: #1e293b; border: 1px solid #e4e4e7; border-radius: 12px; padding: 8px 14px; flex-wrap: wrap; justify-content: center; }
.copy-label { font-size: .78rem; color: #64748b; white-space: nowrap; }
.copy-day-btn { padding: 4px 11px; border-radius: 16px; font-size: .76rem; font-weight: 600; border: 1.5px solid #e4e4e7; background: #0f172a; color: #64748b; cursor: pointer; transition: all .15s; white-space: nowrap; }
.copy-day-btn:hover { border-color: var(--tc); color: var(--tc); }
.copy-day-btn.sel { border-color: var(--tc); background: var(--tc); color: #fff; }
.copy-exec-btn { padding: 4px 14px; border-radius: 16px; font-size: .76rem; font-weight: 700; border: none; background: linear-gradient(135deg,#10b981,#059669); color: #fff; cursor: pointer; transition: opacity .15s; white-space: nowrap; }
.copy-exec-btn:hover:not(:disabled) { opacity: .85; }
.copy-exec-btn:disabled { opacity: .3; cursor: not-allowed; }

.top-actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
.save-btn { background: linear-gradient(135deg,#818cf8,#6366f1); border: none; border-radius: 8px; color: #fff; padding: 6px 16px; font-size: .82rem; font-weight: 600; cursor: pointer; }
.save-btn:hover { opacity: .85; }
.load-btn { background: #1e293b; border: 1.5px solid #e4e4e7; border-radius: 8px; color: #94a3b8; padding: 6px 16px; font-size: .82rem; font-weight: 600; cursor: pointer; }
.load-btn:hover { border-color: #60a5fa; color: #60a5fa; }

/* 내보내기/가져오기 버튼 */
.export-btn { background: linear-gradient(135deg,#f59e0b,#d97706); border: none; border-radius: 8px; color: #fff; padding: 6px 16px; font-size: .82rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.export-btn:hover { opacity: .85; }
.import-btn { background: linear-gradient(135deg,#06b6d4,#0891b2); border: none; border-radius: 8px; color: #fff; padding: 6px 16px; font-size: .82rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.import-btn:hover { opacity: .85; }

/* 모달 */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 9000; display: flex; align-items: center; justify-content: center; }
.modal-backdrop.hidden { display: none; }
.modal-box { background: #1e293b; border: 1px solid #e4e4e7; border-radius: 14px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.8); position: relative; }

#saveModalBox { width: 340px; max-height: 75vh; display: flex; flex-direction: column; gap: 12px; }
.modal-title { font-size: .95rem; font-weight: 700; color: #f1f5f9; }
.modal-close { position: absolute; top: 12px; right: 14px; background: none; border: none; color: #64748b; font-size: 1.1rem; cursor: pointer; line-height: 1; padding: 2px 4px; }
.modal-close:hover { color: #f1f5f9; }
.save-input-row { display: flex; gap: 6px; }
.save-name-inp { flex: 1; background: #0f172a; border: 1px solid #e4e4e7; border-radius: 7px; color: #f1f5f9; padding: 6px 10px; font-size: .83rem; outline: none; }
.save-name-inp:focus { border-color: #818cf8; }
.do-save-btn { background: #818cf8; border: none; border-radius: 7px; color: #fff; padding: 6px 13px; font-size: .83rem; font-weight: 600; cursor: pointer; flex-shrink: 0; }
.save-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 38vh; }
.save-item { background: #0f172a; border: 1px solid #e4e4e7; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
.save-item-info { flex: 1; min-width: 0; }
.save-item-name { font-size: .85rem; font-weight: 600; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-item-date { font-size: .72rem; color: #64748b; margin-top: 2px; }
.save-item-days { font-size: .72rem; color: #818cf8; margin-top: 1px; }
.si-load { background: #3b82f6; border: none; border-radius: 5px; color: #fff; padding: 3px 9px; font-size: .75rem; cursor: pointer; flex-shrink: 0; }
.si-del  { background: none; border: none; color: #475569; font-size: .9rem; cursor: pointer; flex-shrink: 0; }
.si-del:hover { color: #ef4444; }

#confirmModalBox { width: 300px; display: flex; flex-direction: column; gap: 14px; }
.confirm-msg { font-size: .88rem; color: #e2e8f0; line-height: 1.6; }
.day-chips { display: flex; gap: 5px; flex-wrap: wrap; }
.day-chip { padding: 3px 10px; border-radius: 12px; font-size: .75rem; font-weight: 600; color: #fff; }
.confirm-btns { display: flex; gap: 8px; justify-content: flex-end; }
.btn-cancel { background: #1e293b; border: 1.5px solid #e4e4e7; border-radius: 7px; color: #94a3b8; padding: 7px 14px; font-size: .83rem; cursor: pointer; }
.btn-cancel:hover { border-color: #60a5fa; color: #60a5fa; }
.btn-ok { background: #10b981; border: none; border-radius: 7px; color: #fff; padding: 7px 18px; font-size: .83rem; font-weight: 600; cursor: pointer; }
.btn-ok:hover { opacity: .85; }

.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #10b981; color: #fff; border-radius: 10px; padding: 9px 20px; font-size: .83rem; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 20000; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }

.main-layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1080px; }
.clock-wrap { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#cv { display: block; user-select: none; cursor: default; width: 460px; height: 460px; }
.drag-hint { font-size: .7rem; color: #475569; }
#tooltip { position: fixed; background: #1e293b; border: 1px solid #e4e4e7; border-radius: 7px; padding: 5px 11px; font-size: .8rem; color: #f1f5f9; pointer-events: none; white-space: nowrap; z-index: 8000; box-shadow: 0 4px 12px rgba(0,0,0,.5); opacity: 0; transition: opacity .15s; }

.panel { flex: 1; min-width: 310px; max-width: 440px; display: flex; flex-direction: column; gap: 8px; }
.panel-header { display: flex; justify-content: space-between; align-items: center; }
.panel-title { font-size: .92rem; font-weight: 600; color: #cbd5e1; }
.add-btn { background: linear-gradient(135deg,#818cf8,#a78bfa); border: none; border-radius: 8px; color: #fff; padding: 5px 13px; font-size: .8rem; font-weight: 600; cursor: pointer; }
.add-btn:hover { opacity: .85; }
.list-wrap { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; }
.list-wrap::-webkit-scrollbar { width: 3px; }
.list-wrap::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
.bc { background: #1e293b; border-left: 3px solid var(--c); border-top: 1px solid #e4e4e7; border-right: 1px solid #e4e4e7; border-bottom: 1px solid #e4e4e7; border-radius: 8px; padding: 5px 9px; display: flex; align-items: center; gap: 6px; transition: background .15s; }
.bc:hover { background: #243044; }
.bc.dg { background: #243044; box-shadow: 0 0 0 1px var(--c); }
.bc.empty { opacity: .38; }
.bname { flex: 1; background: transparent; border: none; color: #f1f5f9; font-size: .83rem; font-weight: 600; outline: none; min-width: 0; padding: 0; }
.bname::placeholder { color: #334155; }
.dur-inp { background: #0f172a; border: 1px solid transparent; border-radius: 5px; color: var(--c); font-size: .79rem; font-weight: 700; font-family: monospace; padding: 2px 5px; width: 50px; text-align: center; outline: none; cursor: pointer; transition: border-color .15s; flex-shrink: 0; }
.dur-inp:focus { border-color: var(--c); }
.bc.empty .dur-inp { color: #334155; }
.time-pair { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.t-inp { background: transparent; border: none; border-bottom: 1px solid transparent; color: #64748b; font-size: .72rem; font-family: monospace; width: 76px; text-align: center; outline: none; cursor: pointer; padding: 1px 2px; transition: border-color .15s, color .15s; }
.t-inp:focus { border-bottom-color: var(--c); color: #cbd5e1; }
.bc.empty .t-inp { color: #334155; }
.t-sep { color: #334155; font-size: .66rem; flex-shrink: 0; }
.color-btn { width: 13px; height: 13px; border-radius: 50%; background: var(--c); border: 2px solid #e4e4e7; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 0 1px var(--c); transition: transform .15s; }
.color-btn:hover { transform: scale(1.25); }
.color-popup { position: fixed; z-index: 19000; background: #1e293b; border: 1px solid #e4e4e7; border-radius: 10px; padding: 8px; display: grid; grid-template-columns: repeat(5,22px); gap: 5px; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
.color-popup.hidden { display: none; }
.cp-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .12s, border-color .12s; }
.cp-dot:hover { transform: scale(1.15); border-color: #fff; }
.cp-dot.sel { border-color: #fff; }
.del { background: none; border: none; color: #334155; font-size: .88rem; cursor: pointer; padding: 0 2px; flex-shrink: 0; transition: color .15s; }
.del:hover { color: #ef4444; }
.total { background: #1e293b; border: 1px solid #e4e4e7; border-radius: 9px; padding: 9px 13px; display: flex; justify-content: space-between; align-items: center; }
.total span:first-child { font-size: .8rem; color: #64748b; }
.total span:last-child  { font-size: .92rem; font-weight: 700; color: #f1f5f9; }
</style>

<script src="http://innowork.skinnovation.com/libs/tailwind.js"></script>

<body>
<h1>🕐 시간표 툴</h1>
<p class="subtitle">시계 바깥 띠에 일정 블록을 배치하고 관리하세요</p>

<div class="day-bar" id="dayBar"></div>

<div class="copy-bar">
  <span class="copy-label" id="copyLabel">📋 현재 일정 복사 →</span>
  <div id="copyTargets" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
  <button class="copy-exec-btn" id="copyExecBtn" disabled="">적용</button>
</div>

<div class="top-actions">
  <button class="save-btn" id="btnSave">💾 저장</button>
  <button class="load-btn" id="btnLoad">📂 불러오기</button>
  <button class="export-btn" id="btnExport">⬇️ 내보내기</button>
  <button class="import-btn" id="btnImport">⬆️ 가져오기</button>
  <!-- 가져오기용 숨겨진 파일 input -->
  <input type="file" id="importFile" accept=".json" style="display:none;">
</div>

<div class="main-layout">
  <div class="clock-wrap">
    <canvas id="cv"></canvas>
    <span class="drag-hint">🖱️ 띠의 블록을 드래그해서 이동</span>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title" id="panelTitle">일정 블록</span>
      <button class="add-btn" id="addBtn">＋ 블록 추가</button>
    </div>
    <div class="list-wrap" id="bList"></div>
    <div class="total"><span>총 계획 시간</span><span id="ttl">0:00</span></div>
  </div>
</div>

<div id="tooltip"></div>
<div class="color-popup hidden" id="cpop"></div>

<!-- 저장 모달 -->
<div class="modal-backdrop hidden" id="saveBackdrop">
  <div class="modal-box" id="saveModalBox">
    <button class="modal-close" id="btnCloseSave">✕</button>
    <div class="modal-title" id="saveModalTitle">저장</div>
    <div class="save-input-row" id="saveInputRow">
      <input class="save-name-inp" id="saveNameInp" placeholder="버전 이름 입력..." maxlength="30">
      <button class="do-save-btn" id="btnDoSave">저장</button>
    </div>
    <div class="save-list" id="saveList"></div>
  </div>
</div>

<!-- 확인 모달 -->
<div class="modal-backdrop hidden" id="confirmBackdrop">
  <div class="modal-box" id="confirmModalBox">
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="day-chips" id="confirmChips"></div>
    <div class="confirm-btns">
      <button class="btn-cancel" id="btnConfirmCancel">취소</button>
      <button class="btn-ok" id="btnConfirmOk">덮어쓰기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══ 캔버스 ══ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const DPR=Math.max(window.devicePixelRatio||1,2), LOGIC=460, SZ=LOGIC*DPR;
cv.width=cv.height=SZ; cv.style.width=cv.style.height=LOGIC+'px'; ctx.scale(DPR,DPR);
const CX=230,CY=230,RI=122,RBI=141,RBO=205,BAND=RBO-RBI;

const COLORS=['#818cf8','#a78bfa','#f472b6','#fb7185','#f87171','#fb923c','#fbbf24','#facc15','#a3e635','#4ade80','#34d399','#2dd4bf','#22d3ee','#60a5fa','#38bdf8','#c084fc','#e879f9','#fdba74','#86efac','#6ee7b7'];
const DAY_COLORS=['#818cf8','#f472b6','#fb923c','#4ade80','#60a5fa','#f87171','#a78bfa'];
const DAYS=[{k:'mon',l:'월'},{k:'tue',l:'화'},{k:'wed',l:'수'},{k:'thu',l:'목'},{k:'fri',l:'금'},{k:'sat',l:'토'},{k:'sun',l:'일'}];
const MAX=30,SNAP=5,MAG=20;

let schedules={}, activeDayIdx=0, activeBlocks=[], uid=0;
let copyTargets=new Set();

/* ══ 모달 ══ */
function openModal(id){ document.getElementById(id).classList.remove('hidden'); }
function closeModal(id){ document.getElementById(id).classList.add('hidden'); }
['saveBackdrop','confirmBackdrop'].forEach(id=>{
  const backdrop=document.getElementById(id);
  const box=backdrop.querySelector('.modal-box');
  backdrop.addEventListener('mousedown',e=>{ if(e.target===backdrop) closeModal(id); });
  box.addEventListener('mousedown',e=>e.stopPropagation());
});
document.getElementById('btnCloseSave').addEventListener('click',()=>closeModal('saveBackdrop'));
document.getElementById('btnDoSave').addEventListener('click',doSave);
document.getElementById('saveNameInp').addEventListener('keydown',e=>{ if(e.key==='Enter') doSave(); });
document.getElementById('btnSave').addEventListener('click',openSaveModal);
document.getElementById('btnLoad').addEventListener('click',openLoadModal);
document.getElementById('btnConfirmCancel').addEventListener('click',()=>closeModal('confirmBackdrop'));

/* ══ 내보내기 / 가져오기 ══ */
document.getElementById('btnExport').addEventListener('click', () => {
  // 현재 localStorage의 저장 목록 전체를 JSON 파일로 다운로드
  const saves = getSaves();
  const snap  = {};
  DAYS.forEach(d => {
    const sc = schedules[d.k];
    snap[d.k] = { on: sc.on, blocks: sc.blocks.map(b=>({...b})) };
  });
  const exportData = {
    version: 1,
    exportedAt: new Date().toLocaleString('ko-KR'),
    currentSchedule: snap,   // 현재 화면 상태
    saves: saves              // localStorage 저장 목록 전체
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `timetool_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ 내보내기 완료! 파일을 저장하세요.');
});

document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if(!data.version || !data.currentSchedule) throw new Error('invalid');

      // 저장 목록 복원 (localStorage)
      if(data.saves && Array.isArray(data.saves)) {
        putSaves(data.saves);
      }

      // 현재 스케줄 복원
      uid = 0;
      DAYS.forEach(d => {
        const sc = data.currentSchedule[d.k] || {on:false, blocks:[]};
        schedules[d.k] = { on: sc.on, blocks: sc.blocks.map(b=>({...b, id:uid++})) };
      });
      const fi = DAYS.findIndex(d=>schedules[d.k].on);
      activeDayIdx = fi>=0 ? fi : 0;
      activeBlocks = schedules[DAYS[activeDayIdx].k].blocks;
      copyTargets.clear();
      renderDayBar(); render(); draw();
      showToast('⬆️ 가져오기 완료!');
    } catch {
      showToast('❌ 파일 형식이 올바르지 않습니다.');
    }
    // input 초기화 (같은 파일 재선택 가능하게)
    e.target.value = '';
  };
  reader.readAsText(file);
});

/* ══ 초기화 ══ */
function initDays(){
  DAYS.forEach(d=>{ schedules[d.k]={on:false,blocks:[]}; });
  schedules['mon'].on=true;
  schedules['mon'].blocks=makeDefaultBlocks();
  activeDayIdx=0; activeBlocks=schedules['mon'].blocks;
}
function makeDefaultBlocks(){
  const arr=[];
  const add=(n,s,e,ci)=>arr.push(mkB(n,s,e,ci,false));
  add('귀가',    20*60+55,21*60+45,13);
  add('씻기',    21*60+45,22*60+15,11);
  add('휴식',    22*60+15,22*60+45, 1);
  add('수면',    22*60+45, 5*60+45, 0);
  add('씻고출근', 5*60+45,  6*60+5,  7);
  add('출근',     6*60+5,   6*60+55, 3);
  for(let i=0;i<9;i++) arr.push(mkB('',0,0,pm(i+5,COLORS.length),true));
  return arr;
}
function makeEmptyBlocks(){
  const arr=[];
  for(let i=0;i<15;i++) arr.push(mkB('',0,0,pm(i,COLORS.length),true));
  return arr;
}

/* ══ 요일 탭 ══ */
function renderDayBar(){
  const bar=document.getElementById('dayBar'); bar.innerHTML='';
  DAYS.forEach((d,i)=>{
    const sc=schedules[d.k];
    const btn=document.createElement('button');
    btn.className='day-tab'+(sc.on?' on':'')+(i===activeDayIdx?' active':'');
    btn.style.setProperty('--tc',DAY_COLORS[i]);
    btn.textContent=sc.on?`${d.l} ✓`:d.l;
    btn.title='클릭: 탭 전환 / 더블클릭: ON/OFF';
    btn.addEventListener('click',()=>switchTab(i));
    btn.addEventListener('dblclick',e=>{e.preventDefault();toggleDay(i);});
    bar.appendChild(btn);
  });
  document.getElementById('panelTitle').textContent=`${DAYS[activeDayIdx].l}요일 일정`;
  renderCopyBar();
}
function switchTab(i){
  activeDayIdx=i; copyTargets.clear();
  const dk=DAYS[i].k;
  if(!schedules[dk].on){ schedules[dk].on=true; if(!schedules[dk].blocks.length) schedules[dk].blocks=makeEmptyBlocks(); }
  activeBlocks=schedules[dk].blocks;
  renderDayBar(); render(); draw();
}
function toggleDay(i){
  const dk=DAYS[i].k;
  schedules[dk].on=!schedules[dk].on;
  if(schedules[dk].on&&!schedules[dk].blocks.length) schedules[dk].blocks=makeEmptyBlocks();
  if(!schedules[dk].on&&activeDayIdx===i){
    const nx=DAYS.findIndex(d=>schedules[d.k].on);
    activeDayIdx=nx>=0?nx:0; activeBlocks=schedules[DAYS[activeDayIdx].k].blocks;
  }
  if(schedules[dk].on){activeDayIdx=i;activeBlocks=schedules[dk].blocks;}
  copyTargets.clear(); renderDayBar(); render(); draw();
}

/* ══ 복사 바 ══ */
function renderCopyBar(){
  document.getElementById('copyLabel').textContent=`📋 "${DAYS[activeDayIdx].l}요일" 일정 복사 →`;
  const ct=document.getElementById('copyTargets'); ct.innerHTML='';
  DAYS.forEach((d,i)=>{
    if(i===activeDayIdx) return;
    const btn=document.createElement('button');
    btn.className='copy-day-btn'+(copyTargets.has(d.k)?' sel':'');
    btn.style.setProperty('--tc',DAY_COLORS[i]);

    btn.addEventListener('click',()=>{
      if(copyTargets.has(d.k)){copyTargets.delete(d.k);btn.classList.remove('sel');}

}

document.getElementById('copyExecBtn').addEventListener('click',execCopy);
function execCopy(){
  if(copyTargets.size===0) return;
  const willOverwrite=DAYS.filter(d=>copyTargets.has(d.k)&&schedules[d.k].on&&schedules[d.k].blocks.some(b=>!b.empty));

function doCopy(){

/* ══ 유틸 ══ */
const pm=(n,m)=>((n%m)+m)%m;
const sn=m=>Math.round(m/SNAP)*SNAP;
function bDur(b){ if(b.empty)return 0; const d=pm(b.e-b.s,1440); return d||1440; }
function fmt(m){ m=pm(Math.round(m),1440); const h=Math.floor(m/60),mn=m%60; return`${h%12||12}:${String(mn).padStart(2,'0')} ${h<12?'AM':'PM'}`; }
function parseT(s){
  if(!s||s.includes('-')) return null;
  s=s.trim().toUpperCase().replace('.',':');
  let isPM=false,isAM=false;
  if(/P\.?M\.?/.test(s)){isPM=true;s=s.replace(/P\.?M\.?/g,'').trim();}
  else if(/A\.?M\.?/.test(s)){isAM=true;s=s.replace(/A\.?M\.?/g,'').trim();}
  let h,m=0;
  if(s.includes(':')){ const p=s.split(':');h=+p[0];m=+p[1]; }
  else if(s.length<=2) h=+s;
  else if(s.length===3){h=+s[0];m=+s.slice(1);}
  else if(s.length===4){h=+s.slice(0,2);m=+s.slice(2);}
  else return null;
  if(isNaN(h)||isNaN(m)||m<0||m>59) return null;
  if(isPM||isAM){if(h<1||h>12)return null;if(isPM&&h!==12)h+=12;if(isAM&&h===12)h=0;}
  else{if(h<0||h>23)return null;}
  return h*60+m;
}
function parseDur(s){
  s=s.trim().toLowerCase();
  if(s.includes('h')){const p=s.split('h');return(+p[0]||0)*60+(+p[1]||0);}
  if(s.includes(':')){ const p=s.split(':');return(+p[0])*60+(+p[1]||0);}
  const n=+s; return isNaN(n)?null:n;
}
function dStr(b){ if(b.empty)return'0:00'; const d=bDur(b); return`${Math.floor(d/60)}:${String(d%60).padStart(2,'0')}`; }
function m2a(m){ return(pm(m,1440)/1440)*Math.PI*2-Math.PI/2; }
function a2m(a){ return(pm(a+Math.PI/2,Math.PI*2)/(Math.PI*2))*1440; }
function eXY(e){ const r=cv.getBoundingClientRect(); return{x:(e.clientX-r.left)*(LOGIC/r.width),y:(e.clientY-r.top)*(LOGIC/r.height)}; }
function eAngle(e){ const p=eXY(e); return Math.atan2(p.y-CY,p.x-CX); }
function eDist(e){ const p=eXY(e); return Math.hypot(p.x-CX,p.y-CY); }
function inBand(e){ const d=eDist(e); return d>=RBI-10&&d<=RBO+10; }
function minInB(m,b){ if(b.empty)return false; return pm(m-b.s,1440)<bDur(b); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ══ 겹침 ══ */
function overlaps(skipId,ns,d){
  if(d<=0)return false; if(d>1440)return true;
  ns=pm(ns,1440);
  for(const o of activeBlocks){
    if(o.id===skipId||o.empty)continue;
    const od=bDur(o); if(od===0)continue;
    if(pm(ns-o.s,1440)<od)return true;
    if(pm(o.s-ns,1440)<d)return true;
  }
  return false;
}
function findSlot(d){ if(d<=0)return 0; for(let s=0;s<1440;s++){if(!overlaps(-1,s,d))return s;} return null; }
function magnet(sid,cand,d){
  let best=cand,bd=MAG+1;
  for(const o of activeBlocks){
    if(o.id===sid||o.empty)continue;
    const d1=Math.min(pm(cand-o.e,1440),pm(o.e-cand,1440));
    if(d1<bd){bd=d1;best=pm(o.e,1440);}
    const myE=pm(cand+d,1440),d2=Math.min(pm(myE-o.s,1440),pm(o.s-myE,1440));
    if(d2<bd){bd=d2;best=pm(o.s-d,1440);}
  }
  return best;
}
function applyDur(b,nd){
  if(nd<0||nd>1440)return false;
  if(nd===0){b.empty=true;return true;}
  const nS=pm(b.e-nd,1440);
  if(!overlaps(b.id,nS,nd)){b.s=nS;b.empty=false;return true;}
  if(!overlaps(b.id,b.s,nd)){b.e=pm(b.s+nd,1440);b.empty=false;return true;}
  return false;
}
function mkB(name,s,e,ci,empty=false){
  const b={id:uid++,name,s,e,empty,color:COLORS[pm(ci,COLORS.length)]};
  if(empty){b.s=0;b.e=0;} return b;
}

/* ══ 블록 추가/삭제 ══ */
document.getElementById('addBtn').addEventListener('click',()=>{
  const emp=activeBlocks.find(b=>b.empty);
  if(emp){const slot=findSlot(30);if(slot===null){alert('빈 시간대가 없습니다.');return;}emp.empty=false;emp.s=slot;emp.e=pm(slot+30,1440);render();draw();return;}
  if(activeBlocks.length>=MAX){alert(`최대 ${MAX}개까지 추가 가능합니다.`);return;}
  const slot=findSlot(30);if(slot===null){alert('빈 시간대가 없습니다.');return;}
  activeBlocks.push(mkB('새 블록',slot,pm(slot+30,1440),uid,false));
  render();draw();
});
function delBlock(id){
  const b=activeBlocks.find(x=>x.id===id);if(!b)return;
  b.empty=true;b.name='';b.s=0;b.e=0;render();draw();
}

/* ══ 패널 렌더링 ══ */
function render(){
  const el=document.getElementById('bList');el.innerHTML='';
  let tot=0;
  activeBlocks.forEach(b=>{
    if(!b.empty)tot+=bDur(b);
    const d=document.createElement('div');
    d.className='bc'+(b.empty?' empty':'');d.id='c'+b.id;d.style.setProperty('--c',b.color);
    d.innerHTML=`
      <div class="color-btn" title="색상 변경"></div>
      <input class="bname" value="${esc(b.name)}" placeholder="일정 이름">
      <input class="dur-inp" id="dr${b.id}" value="${dStr(b)}" title="지속시간">
      <div class="time-pair">
        <input class="t-inp" id="st${b.id}" value="${b.empty?'--:--':fmt(b.s)}" title="시작시간">
        <span class="t-sep">–</span>
        <input class="t-inp" id="et${b.id}" value="${b.empty?'--:--':fmt(b.e)}" title="종료시간">
      </div>
      <button class="del" title="삭제">✕</button>`;
    d.querySelector('.color-btn').addEventListener('click',e=>{e.stopPropagation();openCP(b.id,e);});
    const ni=d.querySelector('.bname');ni.addEventListener('input',()=>{b.name=ni.value;draw();});
    const di=d.querySelector('.dur-inp');di.addEventListener('change',()=>onDur(b.id,di.value));di.addEventListener('focus',()=>di.select());
    const si=d.querySelector('#st'+b.id);si.addEventListener('change',()=>onSt(b.id,si.value));si.addEventListener('focus',()=>si.select());
    const ei=d.querySelector('#et'+b.id);ei.addEventListener('change',()=>onEt(b.id,ei.value));ei.addEventListener('focus',()=>ei.select());
    d.querySelector('.del').addEventListener('click',()=>delBlock(b.id));
    el.appendChild(d);
  });
  document.getElementById('ttl').textContent=`${Math.floor(tot/60)}:${String(tot%60).padStart(2,'0')}`;
}
function sync(b){
  const g=id=>document.getElementById(id);
  if(g('st'+b.id))g('st'+b.id).value=b.empty?'--:--':fmt(b.s);
  if(g('et'+b.id))g('et'+b.id).value=b.empty?'--:--':fmt(b.e);
  if(g('dr'+b.id))g('dr'+b.id).value=dStr(b);
  const card=document.getElementById('c'+b.id);if(card)card.className='bc'+(b.empty?' empty':'');
  let tot=0;activeBlocks.forEach(x=>{if(!x.empty)tot+=bDur(x);});
  document.getElementById('ttl').textContent=`${Math.floor(tot/60)}:${String(tot%60).padStart(2,'0')}`;
}
function flashErr(id){const e=document.getElementById(id);if(!e)return;const oc=e.style.color;e.style.color='#ef4444';setTimeout(()=>{e.style.color=oc;},700);}
function onDur(id,v){const b=activeBlocks.find(x=>x.id===id);if(!b)return;const m=parseDur(v);if(m===null||!applyDur(b,m)){flashErr('dr'+id);document.getElementById('dr'+id).value=dStr(b);return;}sync(b);draw();}
function onSt(id,v){const b=activeBlocks.find(x=>x.id===id);if(!b)return;const p=parseT(v);if(p===null){flashErr('st'+id);document.getElementById('st'+id).value=b.empty?'--:--':fmt(b.s);return;}const d=b.empty?30:bDur(b);if(overlaps(b.id,p,d)){flashErr('st'+id);document.getElementById('st'+id).value=b.empty?'--:--':fmt(b.s);return;}b.s=p;b.e=pm(p+d,1440);b.empty=false;sync(b);draw();}
function onEt(id,v){const b=activeBlocks.find(x=>x.id===id);if(!b)return;const p=parseT(v);if(p===null){flashErr('et'+id);document.getElementById('et'+id).value=b.empty?'--:--':fmt(b.e);return;}const d=pm(p-b.s,1440)||1440;if(d<1||overlaps(b.id,b.s,d)){flashErr('et'+id);document.getElementById('et'+id).value=b.empty?'--:--':fmt(b.e);return;}b.e=p;b.empty=false;sync(b);draw();}

/* ══ 툴팁 ══ */
const tip=document.getElementById('tooltip');
function showTip(e,text){tip.textContent=text;tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-8)+'px';tip.style.opacity='1';}
function hideTip(){tip.style.opacity='0';}

/* ══ 드래그 ══ */
let drag={active:false,id:null,d:0,off:0};
function onDS(e){if(!inBand(e))return;const m=a2m(eAngle(e)),hit=activeBlocks.find(b=>minInB(m,b));if(!hit)return;drag={active:true,id:hit.id,d:bDur(hit),off:pm(m-hit.s,1440)};cv.style.cursor='grabbing';const c=document.getElementById('c'+hit.id);if(c)c.classList.add('dg');}
function onDM(e){
  if(!drag.active){
    if(inBand(e)){const m=a2m(eAngle(e)),hit=activeBlocks.find(b=>minInB(m,b));if(hit){cv.style.cursor='grab';showTip(e,hit.name?`${hit.name}  ${fmt(hit.s)} – ${fmt(hit.e)}  (${dStr(hit)})`:fmt(hit.s)+' – '+fmt(hit.e));return;}}
    cv.style.cursor='default';hideTip();return;
  }
  hideTip();
  const b=activeBlocks.find(x=>x.id===drag.id);if(!b)return;
  let ns=sn(pm(a2m(eAngle(e))-drag.off,1440));
  const mg=magnet(drag.id,ns,drag.d);if(!overlaps(drag.id,mg,drag.d))ns=mg;
  if(overlaps(drag.id,ns,drag.d))return;
  b.s=ns;b.e=pm(ns+drag.d,1440);sync(b);draw();
}
function onDE(){if(!drag.active)return;drag.active=false;cv.style.cursor='default';const c=document.getElementById('c'+drag.id);if(c)c.classList.remove('dg');drag.id=null;render();draw();}
cv.addEventListener('mousedown',onDS);
cv.addEventListener('mousemove',onDM);
cv.addEventListener('mouseleave',()=>{hideTip();if(!drag.active)cv.style.cursor='default';onDE();});
cv.addEventListener('mouseup',onDE);
cv.addEventListener('touchstart',e=>{e.preventDefault();onDS(e.touches[0]);},{passive:false});
cv.addEventListener('touchmove', e=>{e.preventDefault();onDM(e.touches[0]);},{passive:false});
cv.addEventListener('touchend',  ()=>onDE(),{passive:false});

function doSave(){
  const name=document.getElementById('saveNameInp').value.trim()||'시간표 '+new Date().toLocaleTimeString('ko-KR');

  const snap={};DAYS.forEach(d=>{const sc=schedules[d.k];snap[d.k]={on:sc.on,blocks:sc.blocks.map(b=>({...b}))};});

function loadSave(idx){

  uid=0;
  DAYS.forEach(d=>{const sc=s.schedules[d.k]||{on:false,blocks:[]};schedules[d.k]={on:sc.on,blocks:sc.blocks.map(b=>({...b,id:uid++}))};});
  const fi=DAYS.findIndex(d=>schedules[d.k].on);activeDayIdx=fi>=0?fi:0;
  activeBlocks=schedules[DAYS[activeDayIdx].k].blocks;
  copyTargets.clear();closeModal('saveBackdrop');renderDayBar();render();draw();
  showToast('📂 불러오기 완료!');
}
function deleteSave(idx){const saves=getSaves();saves.splice(idx,1);putSaves(saves);renderSaveList();}

/* ══ Canvas ══ */
function draw(){
  ctx.clearRect(0,0,LOGIC,LOGIC);
  const gr=ctx.createRadialGradient(CX,CY,10,CX,CY,RBO+28);gr.addColorStop(0,'#1e293b');gr.addColorStop(1,'#0f172a');
  ctx.beginPath();ctx.arc(CX,CY,RBO+26,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
  ctx.beginPath();ctx.arc(CX,CY,RBO,0,Math.PI*2);ctx.fillStyle='#1e2d40';ctx.fill();
  ctx.beginPath();ctx.arc(CX,CY,RBI,0,Math.PI*2);ctx.fillStyle='#0f172a';ctx.fill();
  const dragB=drag.active?activeBlocks.find(b=>b.id===drag.id):null;
  activeBlocks.filter(b=>!b.empty&&(!dragB||b.id!==drag.id)).forEach(b=>drawB(b,false));
  if(dragB&&!dragB.empty)drawB(dragB,true);
  [RBO,RBI].forEach(r=>{ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.strokeStyle='#3d5068';ctx.lineWidth=1;ctx.stroke();});
  const fg=ctx.createRadialGradient(CX,CY-18,8,CX,CY,RI);fg.addColorStop(0,'#1e3d6b');fg.addColorStop(1,'#0c1929');
  ctx.beginPath();ctx.arc(CX,CY,RI,0,Math.PI*2);ctx.fillStyle=fg;ctx.fill();
  ctx.beginPath();ctx.arc(CX,CY,RI,0,Math.PI*2);ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.5;ctx.stroke();
